name: Clear queue

on:
  workflow_dispatch: {}      # throws away every ready (not yet posted) video so the next Make run makes fresh ones

concurrency:
  group: dio-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml && python -m pipeline.clear_queue
      - run: |
          bash tools/save_state.sh "bot: queue cleared $(date -u +%F)"
