name: Clear queue

on:
  workflow_dispatch: {}      # throws away every ready (not yet posted) video so the next Make run makes fresh ones

concurrency:
  group: dio-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml && python -m pipeline.clear_queue
      - run: |
          bash tools/save_state.sh "bot: queue cleared $(date -u +%F)"
