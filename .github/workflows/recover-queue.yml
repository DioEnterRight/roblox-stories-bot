name: Recover queue

on:
  workflow_dispatch: {}

concurrency:
  group: roblox-stories-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - run: python -m pipeline.recover
      - name: Save memory
        if: always()
        run: bash tools/save_state.sh "recovered queue $(date -u +%F)"
