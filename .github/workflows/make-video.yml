name: Make video

on:
  schedule:
    - cron: "17 * * * *"     # every hour: the gate decides if a video is needed for the next slots (config.yaml schedule)
  workflow_dispatch:
    inputs:
      test:
        description: "Test mode: no keys used, nothing queued, uploads a sample video you can watch (untick to make a real video)"
        type: boolean
        default: true
      language:
        description: "Language (auto = what the schedule needs next)"
        type: choice
        default: auto
        options: [auto, en, hi]

concurrency:
  group: dio-make            # one Make at a time; posting has its own queue, so a long render never blocks a post
  cancel-in-progress: false

permissions:
  contents: write            # save bot state (data/) and create the Release that queues the video
  issues: write              # "post it by hand" notices

jobs:
  gate:   # cheap: is a video needed for the next upload slots? (most hourly runs stop here in seconds)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      make: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.make == 'true' }}
      stats: ${{ github.event_name == 'workflow_dispatch' || steps.gate.outputs.stats == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: gate
        if: github.event_name != 'workflow_dispatch'
        run: pip install -q pyyaml && python -m pipeline.schedule make

  make:
    needs: gate
    if: needs.gate.outputs.make == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240     # script ~3 min, stills ~4 min per version, final 3D render on CPU ~40-70 min
    env:
      GH_TOKEN: ${{ github.token }}
      TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
      CHROME: /usr/bin/google-chrome    # the runner's Chrome renders the 3D (software WebGL, no GPU)
      REMOTION_GL: swangle
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/remotion/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Cache the backup voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Install Python packages + backup voice model
        run: |
          pip install -q -r requirements.txt
          python -m pipeline.fetch_models

      - name: Install the 3D engine (Remotion + three.js)
        working-directory: engine/remotion
        run: npm ci --no-audit --no-fund

      - name: Collect stats from Instagram / YouTube
        if: env.TEST != 'true' && needs.gate.outputs.stats == 'true'
        continue-on-error: true
        env:
          IG_PAGE_TOKEN: ${{ secrets.IG_PAGE_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python -m pipeline.analytics

      - name: Start FreeLLMAPI inside this job (free writer, critic, director, judge)
        if: env.TEST != 'true'
        continue-on-error: true    # no models = offline script bank + auto director; the video is still made
        env:
          FREELLMAPI_KEYS: ${{ secrets.FREELLMAPI_KEYS }}
        run: bash tools/start_freellmapi.sh

      - name: Make the video
        env:
          LANGUAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.language || 'auto' }}
        run: |
          ARGS=""
          if [ "$LANGUAGE" != "auto" ]; then ARGS="--language $LANGUAGE"; fi
          if [ "$TEST" = "true" ]; then
            python -m pipeline.produce --test $ARGS
          else
            python -m pipeline.produce --release $ARGS
          fi

      - name: Show me the test video
        if: env.TEST == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: out/*/final.mp4
          retention-days: 3

      - name: Contact sheets, scripts and scores of every version (you are the final judge)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: versions
          path: |
            out/*/versions/*/sheet.jpg
            out/*/versions/*/*.json
            out/*/versions/*/*.txt
            out/*/*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Save memory (history, ideas, stats, model usage)
        if: always() && env.TEST != 'true'
        run: |
          bash tools/save_state.sh "bot: data $(date -u +%F)"
