name: Test FreeLLMAPI connection

on:
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml
      - name: Start FreeLLMAPI inside this job
        env:
          FREELLMAPI_KEYS: ${{ secrets.FREELLMAPI_KEYS }}
        run: bash tools/start_freellmapi.sh
      - name: Ask FreeLLMAPI one tiny question
        run: python -m pipeline.ping
