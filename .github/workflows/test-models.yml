name: Test free models

on:
  workflow_dispatch: {}      # one tiny request per role: proves FREELLMAPI_KEYS works and shows which models each role uses

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - name: Start FreeLLMAPI
        env:
          FREELLMAPI_KEYS: ${{ secrets.FREELLMAPI_KEYS }}
        run: bash tools/start_freellmapi.sh
      - run: python -m pipeline.llm --check
