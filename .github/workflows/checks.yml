name: Checks

on:
  push:
    paths-ignore: ["data/**"]   # the bot's own state commits do not need a test run
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: engine/remotion/package-lock.json
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q -r requirements.txt pytest pyflakes
      - run: python -m pyflakes pipeline tools tests
      - run: python -m pytest -q
      - name: Typecheck the engine
        working-directory: engine/remotion
        run: npm ci --no-audit --no-fund && npx tsc --noEmit
